[project]
name = "mod-api"
version = "0.1.0"
description = "MOD full-cycle dashboard API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.3.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pymysql==1.1.2",
  "cryptography>=43.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["current*", "releases*", "tests*"]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest>=9.0.3",
  "ruff==0.12.11",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# S110/SIM105：禁止静默吞异常；清理型忽略须显式用 contextlib.suppress 表达意图。
extend-select = ["S110", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning",
]
