# MOD API 请求频率限制配置 (KI-078)
# 仅使用经 realip 模块（cloudflare-realip.conf）按受信任代理还原后的 $binary_remote_addr，
# 不再直接采信可被客户端伪造的最左 X-Forwarded-For 头。

# 全局只读 API 请求频控（单客户端 IP 25r/s，允许突发 burst=50）
limit_req_zone $binary_remote_addr zone=mod_api_limit:10m rate=25r/s;

# 触发超频时统一返回 429 Too Many Requests
limit_req_status 429;
