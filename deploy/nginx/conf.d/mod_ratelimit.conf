# MOD API 请求频率限制配置 (KI-078)
# 提取真实客户端 IP：优先解析 X-Forwarded-For 链的最左客户端 IP，直连或本地回退至 $remote_addr
map $http_x_forwarded_for $client_real_ip {
    ""                  $remote_addr;
    "~^([^,\s]+)"       $1;
    default             $remote_addr;
}

# 全局 API 读请求频控（单客户端 IP 25r/s，允许突发 burst=50）
limit_req_zone $client_real_ip zone=mod_api_limit:10m rate=25r/s;

# 治理工单流转等敏感写入接口频控（单客户端 IP 2r/s，允许突发 burst=5）
limit_req_zone $client_real_ip zone=mod_write_limit:10m rate=2r/s;

# 触发超频时统一返回 429 Too Many Requests
limit_req_status 429;
