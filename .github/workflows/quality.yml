name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy production after checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.6.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-extras --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve comparison base
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          # 若基线提交在当前 checkout 中不可达（force push / rebase 覆盖了旧历史），
          # 回退到 HEAD~1，避免后续 --base diff 因 "bad object" 而崩溃。
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "comparison base ${base} unreachable (likely force-push); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan changed lines for credentials
        run: uv run --project backend pre-commit run detect-secrets --from-ref "${{ steps.comparison.outputs.base }}" --to-ref HEAD

      - name: Validate commit messages
        env:
          GITLINT_COMMITS: "${{ steps.comparison.outputs.base }}..HEAD"
        run: uv run --project backend pre-commit run gitlint-ci --hook-stage manual

      - name: Enforce CURRENT-STATE sync
        run: python3 scripts/project/check_doc_sync.py --base "${{ steps.comparison.outputs.base }}"

      - name: Enforce documentation governance
        run: python3 scripts/project/check_document_governance.py --base "${{ steps.comparison.outputs.base }}"

      - name: Run repository checks
        run: make check

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        id: deploy_config
        env:
          TARGET_HOST: ${{ secrets.USA_HOST || secrets.DEPLOY_HOST_IP || secrets.DEPLOY_HOST }}
          TARGET_KEY: ${{ secrets.USA_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          CHINA_MAP_URL: ${{ vars.VITE_CHINA_MAP_GEOJSON_URL }}
        run: |
          if [ -z "$TARGET_HOST" ] || [ -z "$TARGET_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automated deployment: target host or key is not configured."
            exit 0
          fi
          if [ -z "$CHINA_MAP_URL" ]; then
            echo "::error::VITE_CHINA_MAP_GEOJSON_URL is required for a configured production deployment."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.deploy_config.outputs.configured == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.6.0"

      - name: Set up Node.js
        if: steps.deploy_config.outputs.configured == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.deploy_config.outputs.configured == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.deploy_config.outputs.configured == 'true'
        working-directory: frontend
        env:
          VITE_CHINA_MAP_GEOJSON_URL: ${{ vars.VITE_CHINA_MAP_GEOJSON_URL }}
        run: pnpm build

      - name: Deploy
        if: steps.deploy_config.outputs.configured == 'true'
        env:
          TARGET_HOST: ${{ secrets.USA_HOST || secrets.DEPLOY_HOST_IP || secrets.DEPLOY_HOST }}
          TARGET_KEY: ${{ secrets.USA_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          TARGET_KNOWN_HOST: ${{ secrets.USA_HOST_KEY }}
          CHINA_MAP_URL: ${{ vars.VITE_CHINA_MAP_GEOJSON_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$TARGET_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH_CM_OPTS="-o ControlMaster=auto -o ControlPath=~/.ssh/cm-%r@%h:%p -o ControlPersist=120s"
          if [ -n "$TARGET_KNOWN_HOST" ]; then
            echo "$TARGET_KNOWN_HOST" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=10 $SSH_CM_OPTS"
            echo "Strict SSH host key verification enabled."
          else
            echo "Warning: TARGET_KNOWN_HOST not configured, falling back to permissive checking."
            SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 $SSH_CM_OPTS"
          fi

          TS=$(date +"%Y%m%d-%H%M%S")
          echo "Deploying release $TS to USA..."

          ssh $SSH_OPTS ubuntu@"$TARGET_HOST" \
            "mkdir -p /home/ubuntu/mod/backend/releases/$TS /home/ubuntu/mod/frontend/releases/$TS /home/ubuntu/mod/deploy"

          if [ "$CHINA_MAP_URL" = "/china-map.geojson" ]; then
            ssh $SSH_OPTS ubuntu@"$TARGET_HOST" \
              "test -s /home/ubuntu/mod/frontend/shared/china.geojson"
          fi

          rsync -avz -e "ssh $SSH_OPTS" \
            frontend/dist/ ubuntu@"$TARGET_HOST":/home/ubuntu/mod/frontend/releases/$TS/

          if [ "$CHINA_MAP_URL" = "/china-map.geojson" ]; then
            ssh $SSH_OPTS ubuntu@"$TARGET_HOST" \
              "install -m 0644 /home/ubuntu/mod/frontend/shared/china.geojson /home/ubuntu/mod/frontend/releases/$TS/china-map.geojson"
          fi

          rsync -avz -e "ssh $SSH_OPTS" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='output/' --exclude='tmp/' \
            --exclude='*.csv' --exclude='*.tsv' --exclude='*.sql*' --exclude='*.enc' --exclude='*.gz' \
            backend/app/ \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/backend/releases/$TS/

          rsync -avz -e "ssh $SSH_OPTS" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='output/' --exclude='tmp/' \
            --exclude='*.csv' --exclude='*.tsv' --exclude='*.sql*' --exclude='*.enc' --exclude='*.gz' \
            simulation scripts deploy \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/backend/releases/$TS/

          rsync -avz -e "ssh $SSH_OPTS" \
            deploy/ \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/deploy/

          rsync -avz -e "ssh $SSH_OPTS" \
            backend/pyproject.toml backend/uv.lock \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/backend/

          ssh $SSH_OPTS ubuntu@"$TARGET_HOST" "bash -s $TS" << 'EOF'
            set -e
            TS=$1
            ln -sfn /home/ubuntu/mod/frontend/releases/$TS /home/ubuntu/mod/frontend/current
            ln -sfn /home/ubuntu/mod/backend/releases/$TS /home/ubuntu/mod/backend/current
            ln -sfn . /home/ubuntu/mod/backend/current/app

            cd /home/ubuntu/mod/backend
            ([ -x /home/ubuntu/.cargo/bin/uv ] && /home/ubuntu/.cargo/bin/uv sync --frozen --all-extras) || true

            sudo install -m 0644 /home/ubuntu/mod/deploy/mod-ml-retrain.service /etc/systemd/system/mod-ml-retrain.service
            sudo systemctl daemon-reload
            sudo systemctl reload nginx || sudo systemctl restart nginx
            sudo systemctl reload mod.service || sudo systemctl restart mod.service

            HEALTH=""
            for i in $(seq 1 10); do
              sleep 2
              HEALTH=$(curl -sf http://127.0.0.1:8100/api/health || true)
              if echo "$HEALTH" | grep -q '"status":"ok"'; then
                echo "Health probe passed on attempt $i"
                break
              fi
              echo "Waiting for API to become ready (attempt $i)..."
            done

            if ! echo "$HEALTH" | grep -q '"status":"ok"'; then
              echo "Health probe failed!"
              exit 1
            fi

            SIM=$(curl -sf http://127.0.0.1:8100/api/simulator/status || true)
            if echo "$SIM" | grep -q '"status":"RUNNING"'; then
              echo "Simulator is RUNNING"
            else
              echo "Simulator not RUNNING (independent process, not blocking deploy): $(echo $SIM | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"status\"), d.get(\"last_cycle_status\"))' 2>/dev/null || echo 'no response')"
            fi

            SNAP=""
            for i in $(seq 1 10); do
              sleep 2
              SNAP=$(curl -sf http://127.0.0.1:8100/api/dashboard/snapshot || true)
              if echo "$SNAP" | grep -q '"rolloutTrend"'; then
                echo "Snapshot probe passed on attempt $i"
                break
              fi
              echo "Waiting for snapshot to become ready (attempt $i)..."
            done

            if ! echo "$SNAP" | grep -q '"rolloutTrend"'; then
              echo 'Snapshot contract probe failed!'
              exit 1
            fi

            if [ -n "$SNAP" ]; then
              echo "$SNAP" > /tmp/live_snapshot.json
              python3 /home/ubuntu/mod/backend/releases/$TS/scripts/project/build_fallback_snapshot.py \
                --from-file /tmp/live_snapshot.json \
                --output /home/ubuntu/mod/backend/releases/$TS/fallback-snapshot.json 2>/dev/null || true
              rm -f /tmp/live_snapshot.json
              echo "Fallback snapshot refreshed on USA production node."
            fi

            for d in /home/ubuntu/mod/frontend/releases /home/ubuntu/mod/backend/releases; do
              ls -1t "$d" | tail -n +6 | while read -r old; do
                rm -rf "$d/$old"
              done
            done

            echo 'Deployment to USA verified successfully!'
          EOF

          ssh -O exit -o ControlPath=~/.ssh/cm-%r@%h:%p ubuntu@"$TARGET_HOST" 2>/dev/null || true
