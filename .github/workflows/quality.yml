name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-extras --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve comparison base
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          # 若基线提交在当前 checkout 中不可达（force push / rebase 覆盖了旧历史），
          # 回退到 HEAD~1，避免后续 --base diff 因 "bad object" 而崩溃。
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "comparison base ${base} unreachable (likely force-push); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan changed lines for credentials
        run: python3 scripts/project/scan_secrets.py --base "${{ steps.comparison.outputs.base }}"

      - name: Validate commit messages
        run: python3 scripts/project/validate_commit_message.py --base "${{ steps.comparison.outputs.base }}"

      - name: Lint frontend arbitrary values
        run: python3 scripts/project/lint_frontend_arbitrary_values.py

      - name: Lint frontend style contracts
        run: python3 scripts/project/lint_frontend_styles.py

      - name: Check documentation links
        run: python3 scripts/project/check_doc_links.py

      - name: Enforce CURRENT-STATE sync
        run: python3 scripts/project/check_doc_sync.py --base "${{ steps.comparison.outputs.base }}"

      - name: Enforce documentation governance
        run: python3 scripts/project/check_document_governance.py --base "${{ steps.comparison.outputs.base }}"

      - name: Validate changelog contract
        run: python3 scripts/project/check_changelog.py

      - name: Run repository checks
        run: make check

  deploy:
    name: Deploy to USA Production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Deploy to USA Production Node
        env:
          TARGET_HOST: ${{ secrets.USA_HOST || secrets.DEPLOY_HOST_IP || secrets.DEPLOY_HOST }}
          TARGET_KEY: ${{ secrets.USA_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TARGET_HOST" ] || [ -z "$TARGET_KEY" ]; then
            echo "Skipping automated deployment: TARGET_HOST or TARGET_KEY secret not configured."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$TARGET_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          TS=$(date +"%Y%m%d-%H%M%S")
          echo "Deploying release $TS to USA..."

          SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"

          ssh $SSH_OPTS ubuntu@"$TARGET_HOST" \
            "mkdir -p /home/ubuntu/mod/backend/releases/$TS /home/ubuntu/mod/frontend/releases/$TS /home/ubuntu/mod/deploy"

          rsync -avz -e "ssh $SSH_OPTS" \
            frontend/dist/ ubuntu@"$TARGET_HOST":/home/ubuntu/mod/frontend/releases/$TS/

          rsync -avz -e "ssh $SSH_OPTS" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='output/' --exclude='tmp/' \
            --exclude='*.csv' --exclude='*.tsv' --exclude='*.sql*' --exclude='*.enc' --exclude='*.gz' \
            backend/app/ \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/backend/releases/$TS/

          rsync -avz -e "ssh $SSH_OPTS" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='output/' --exclude='tmp/' \
            --exclude='*.csv' --exclude='*.tsv' --exclude='*.sql*' --exclude='*.enc' --exclude='*.gz' \
            simulation scripts deploy \
            ubuntu@"$TARGET_HOST":/home/ubuntu/mod/backend/releases/$TS/

          ssh $SSH_OPTS ubuntu@"$TARGET_HOST" "bash -s $TS" << 'EOF'
            set -e
            TS=$1
            ln -sfn /home/ubuntu/mod/frontend/releases/$TS /home/ubuntu/mod/frontend/current
            ln -sfn /home/ubuntu/mod/backend/releases/$TS /home/ubuntu/mod/backend/current
            ln -sfn . /home/ubuntu/mod/backend/current/app

            sudo systemctl reload nginx
            sudo systemctl restart mod.service

            HEALTH=""
            for i in $(seq 1 10); do
              sleep 2
              HEALTH=$(curl -sf http://127.0.0.1:8100/api/health || true)
              if echo "$HEALTH" | grep -q '"status":"ok"'; then
                echo "Health probe passed on attempt $i"
                break
              fi
              echo "Waiting for API to become ready (attempt $i)..."
            done

            if ! echo "$HEALTH" | grep -q '"status":"ok"'; then
              echo "Health probe failed!"
              exit 1
            fi

            SIM=$(curl -sf http://127.0.0.1:8100/api/simulator/status || true)
            if ! echo "$SIM" | grep -q '"status":"RUNNING"'; then
              echo 'Simulator probe failed!'
              exit 1
            fi

            for d in /home/ubuntu/mod/frontend/releases /home/ubuntu/mod/backend/releases; do
              ls -1t "$d" | tail -n +6 | while read -r old; do
                rm -rf "$d/$old"
              done
            done

            echo 'Deployment to USA verified successfully!'
          EOF
