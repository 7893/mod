name: Quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-extras --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve comparison base
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan changed lines for credentials
        run: python3 scripts/project/scan_secrets.py --base "${{ steps.comparison.outputs.base }}"

      - name: Validate commit messages
        run: python3 scripts/project/validate_commit_message.py --base "${{ steps.comparison.outputs.base }}"

      - name: Lint frontend arbitrary values
        run: python3 scripts/project/lint_frontend_arbitrary_values.py

      - name: Check documentation links
        run: python3 scripts/project/check_doc_links.py

      - name: Check CURRENT-STATE sync notice
        run: python3 scripts/project/check_doc_sync.py --base "${{ steps.comparison.outputs.base }}"

      - name: Run repository checks
        run: make check
