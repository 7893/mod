name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.16"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.8.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-extras --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve comparison base
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          # 若基线提交在当前 checkout 中不可达（force push / rebase 覆盖了旧历史），
          # 回退到 HEAD~1，避免后续 --base diff 因 "bad object" 而崩溃。
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "comparison base ${base} unreachable (likely force-push); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan changed lines for credentials
        run: uv run --project backend pre-commit run detect-secrets --from-ref "${{ steps.comparison.outputs.base }}" --to-ref HEAD

      - name: Validate commit messages
        env:
          GITLINT_COMMITS: "${{ steps.comparison.outputs.base }}..HEAD"
        run: uv run --project backend pre-commit run gitlint-ci --hook-stage manual

      - name: Enforce CURRENT-STATE sync
        run: python3 scripts/project/check_doc_sync.py --base "${{ steps.comparison.outputs.base }}"

      - name: Enforce documentation governance
        run: python3 scripts/project/check_document_governance.py --base "${{ steps.comparison.outputs.base }}"

      - name: Run repository checks
        run: make check
