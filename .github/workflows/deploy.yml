name: Deploy frontend

# Auto-deploy the built frontend to USA after CI (Quality gates) succeeds on main.
# Frontend-only: builds dist and rsyncs it; never touches backend, database, or services.
# Requires repo secrets: USA_SSH_KEY, USA_HOST, USA_USER.

on:
  workflow_run:
    workflows: ["Quality gates"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-usa
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy when the upstream CI concluded successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.USA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "${{ secrets.USA_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Back up current dist on USA
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.USA_USER }}@${{ secrets.USA_HOST }}" \
            'ts=$(date +%Y%m%d-%H%M%S); [ -d /home/ubuntu/mod/frontend/dist ] && cp -r /home/ubuntu/mod/frontend/dist /home/ubuntu/mod/frontend/dist.bak-$ts && echo "backed up dist.bak-$ts" || echo "no existing dist"'

      - name: Deploy dist to USA
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ secrets.USA_USER }}@${{ secrets.USA_HOST }}:/home/ubuntu/mod/frontend/dist/"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.USA_USER }}@${{ secrets.USA_HOST }}" \
            'test -f /home/ubuntu/mod/frontend/dist/index.html && echo "index.html present" || (echo "MISSING index.html" && exit 1)'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
