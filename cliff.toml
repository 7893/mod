# git-cliff 2.13.1 configuration for release changelog generation.
# The revision range starts after the commit stored in .git-cliff-baseline.
# Local generation and the read-only CI artifact workflow use the same range.

[changelog]
header = """
# 变更日志

本文件由 git-cliff 2.13.1 根据 Conventional Commits 生成，起点为 `.git-cliff-baseline` 记录的公开就绪提交。
发布时产物以触发时的 Git tag/HEAD 为终点；不代表仓库存在某个未创建的版本标签。

<!-- generated by git-cliff 2.13.1; do not edit manually -->
"""
body = """
{% if version %}
## {{ version }}
{% else %}
## 公开基线以后
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^docs", group = "文档" },
  { message = "^refactor", group = "重构" },
  { message = "^perf", group = "性能" },
  { message = "^test", group = "测试" },
  { message = "^build", group = "构建" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "工程维护" },
  { message = "^style", group = "样式" },
  { message = "^revert", group = "回退" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
